<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRIP STORE — Одежда и обувь</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.8/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0e0e09; color: #f5f5f4; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .modal-open { overflow: hidden; }
        .gallery-thumbs { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; }
        .thumb-img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 1px solid #333; }
        .thumb-img:hover { border-color: #fff; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-white selection:text-black pb-20">

    <!-- Шапка сайта -->
    <header class="sticky top-0 z-40 bg-[#0e0e09]/90 backdrop-blur-md border-b border-zinc-800 px-4 py-4 flex justify-between items-center">
        <div onclick="window.adminClicks = (window.adminClicks || 0) + 1; if(window.adminClicks >= 5) { window.adminClicks = 0; let p = prompt('PIN-код администратора:'); if(p === '1234') document.querySelector('.admin-modal').classList.remove('hidden'); }" style="cursor: pointer;" class="flex items-center gap-3">
            <div class="bg-white text-black font-extrabold px-3 py-1.5 rounded-xl text-sm tracking-wider">DS</div>
            <div>
                <h1 class="font-bold text-base leading-tight">DRIP STORE</h1>
                <p class="text-xs text-zinc-400">mobile store</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button class="p-2.5 bg-zinc-900 border border-zinc-800 rounded-xl text-zinc-300 hover:text-white"><i class="fa-regular fa-heart"></i></button>
            <button class="p-2.5 bg-zinc-900 border border-zinc-800 rounded-xl text-zinc-300 hover:text-white"><i class="fa-solid fa-bag-shopping"></i></button>
        </div>
    </header>

    <!-- Основной контент (Витрина) -->
    <main class="flex-1 px-4 py-6 max-w-2xl mx-auto w-full">
        <div class="bg-zinc-900/60 border border-zinc-800/80 rounded-2xl p-4 mb-6 text-xs text-zinc-300">
            <p class="font-medium text-white mb-1">🔥 Премиальное качество, трендовые позиции и быстрая доставка по Казахстану.</p>
            <p class="text-zinc-400">🚚 Доставка от 1500 ₸ • Kaspi Перевод</p>
        </div>

        <h2 class="font-bold text-lg mb-4">КАТАЛОГ ТОВАРОВ</h2>
        
        <!-- Сетка товаров -->
        <div id="products-grid" class="grid grid-cols-2 gap-4">
            <!-- Сюда товары подгружаются автоматически -->
        </div>
    </main>

    <!-- Модальное окно Админ-панели -->
    <div class="admin-modal hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-md p-6 relative max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg">Панель администратора</h3>
                <button data-close class="text-zinc-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="mb-4">
                <h4 class="text-sm font-semibold mb-2">Добавить / Редактировать товар</h4>
                <input type="text" id="edit-product-id" class="hidden">
                <input type="text" id="edit-title" placeholder="Название товара" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-3 mb-2 text-sm text-white">
                <input type="number" id="edit-price" placeholder="Цена (₸)" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-3 mb-2 text-sm text-white">
                <input type="text" id="edit-image" placeholder="Ссылки на фото через запятую (ImgBB)" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-3 mb-2 text-sm text-white">
                <input type="text" id="edit-category" placeholder="Категория (например: Худи)" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-3 mb-4 text-sm text-white">
                
                <button onclick="saveProductData()" class="w-full bg-white text-black font-bold py-3 rounded-xl hover:bg-zinc-200 transition">Сохранить товар</button>
            </div>
        </div>
    </div>

    <script>
        // Базовые товары или локальное хранилище
        let db = {
            products: [
                {
                    id: 1,
                    title: "CHROME HEARTS DARK BLUE MB",
                    price: 18990,
                    image: "https://i.ibb.co/Qj897S7d/image.jpg",
                    category: "Худи"
                }
            ]
        };

        // Рендеринг товаров на витрине с поддержкой галереи (несколько фото через запятую)
        function renderAdminProducts() {
            const grid = document.getElementById('products-grid');
            if (!grid) return;
            
            grid.innerHTML = db.products.map(p => {
                const imgs = p.image ? p.image.split(',').map(i => i.trim()) : [];
                const mainImg = imgs[0] || '';
                
                return `
                    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-3 flex flex-col justify-between">
                        <div>
                            <div class="relative bg-zinc-800 rounded-xl overflow-hidden aspect-square mb-3">
                                <img src="${mainImg}" class="main-img-${p.id} w-full h-full object-cover" alt="${p.title}">
                            </div>
                            <p class="text-[10px] text-zinc-400 uppercase tracking-wider mb-1">${p.category}</p>
                            <h3 class="font-bold text-xs text-zinc-100 line-clamp-2 mb-2">${p.title}</h3>
                        </div>
                        <div>
                            <div class="font-extrabold text-sm text-white mb-2">${p.price.toLocaleString()} ₸</div>
                            ${imgs.length > 1 ? `
                                <div class="flex gap-1 overflow-x-auto pb-1">
                                    ${imgs.map(img => `<img src="${img}" onclick="document.querySelector('.main-img-${p.id}').src='${img}'" class="w-8 h-8 object-cover rounded cursor-pointer border border-zinc-700">`).join('')}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Сохранение товара
        function saveProductData() {
            const id = document.getElementById('edit-product-id').value || Date.now();
            const title = document.getElementById('edit-title').value.trim();
            const price = Number(document.getElementById('edit-price').value);
            const image = document.getElementById('edit-image').value.trim();
            const category = document.getElementById('edit-category').value.trim();

            if (!title || !price) {
                alert('Заполните название и цену!');
                return;
            }

            const existingIndex = db.products.findIndex(p => p.id == id);
            if (existingIndex >= 0) {
                db.products[existingIndex] = { id: Number(id), title, price, image, category };
            } else {
                db.products.push({ id: Number(id), title, price, image, category });
            }

            // Закрываем модалку и обновляем витрину
            document.querySelector('.admin-modal').classList.add('hidden');
            renderAdminProducts();
            alert('Товар успешно сохранен!');
        }

        // Закрытие модальных окон
        document.querySelectorAll('[data-close]').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.admin-modal').forEach(m => m.classList.add('hidden'));
            });
        });

        // Запуск при загрузке страницы
        window.onload = () => {
            renderAdminProducts();
        };
    </script>
</body>
</html>
